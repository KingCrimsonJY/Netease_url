name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
      - name: 代码检查
        run: |
          ruff check .
          ruff format --check .
      - name: 离线测试
        run: pytest
